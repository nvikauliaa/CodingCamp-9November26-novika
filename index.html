<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Header & Balance -->
      <header class="app-header">
        <h1 class="app-title">Expense Tracker</h1>
        <div class="balance-card">
          <span class="balance-label">Total Balance</span>
          <span class="balance-amount" id="total-balance">$0.00</span>
        </div>
      </header>

      <main class="app-main">
        <!-- Left column: Form + Transaction List -->
        <section class="left-col">
          <!-- Input Form -->
          <div class="card">
            <h2 class="card-title">Add Transaction</h2>
            <form id="transaction-form" novalidate>
              <div class="form-group">
                <label for="item-name">Item Name</label>
                <input
                  type="text"
                  id="item-name"
                  placeholder="e.g. Lunch, Bus fare…"
                  autocomplete="off"
                />
                <span class="field-error" id="error-name"></span>
              </div>

              <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input
                  type="number"
                  id="amount"
                  placeholder="0.00"
                  min="0.01"
                  step="0.01"
                />
                <span class="field-error" id="error-amount"></span>
              </div>

              <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="">— Select a category —</option>
                  <option value="Food">🍔 Food</option>
                  <option value="Transport">🚌 Transport</option>
                  <option value="Fun">🎉 Fun</option>
                </select>
                <span class="field-error" id="error-category"></span>
              </div>

              <button type="submit" class="btn-add">Add Transaction</button>
            </form>
          </div>

          <!-- Transaction List -->
          <div class="card">
            <h2 class="card-title">Transactions</h2>
            <ul class="transaction-list" id="transaction-list">
              <!-- Items injected by JS -->
            </ul>
            <p class="empty-state" id="empty-state">No transactions yet. Add one above!</p>
          </div>
        </section>

        <!-- Right column: Chart -->
        <section class="right-col">
          <div class="card chart-card">
            <h2 class="card-title">Spending by Category</h2>
            <div class="chart-container">
              <canvas id="spending-chart"></canvas>
            </div>
            <p class="empty-state" id="chart-empty-state">Add transactions to see the chart.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
